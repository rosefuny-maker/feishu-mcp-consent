<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dirk Feishu MCP verbinden</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#f5f6f7;color:#1f2329;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{background:white;border-radius:12px;padding:32px;max-width:450px;width:calc(100% - 48px);box-shadow:0 1px 5px #0001}
h1{font-size:22px}p{line-height:1.6;font-size:14px}
label{display:block;margin:18px 0 7px}
input[type=password]{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b4bdc8;border-radius:8px;font-size:16px}
button{margin-top:20px;width:100%;padding:12px;background:#3370ff;color:white;border:0;border-radius:8px;font-size:16px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Dirk Feishu MCP verbinden</h1>
<p id="info">Die Verbindung erfolgt über Dirks eigenen ChatGPT-MCP-Dienst. Bitte den <strong>DIRK_MCP_APPROVAL_CODE</strong> eingeben, nicht das Feishu App Secret.</p>
<form id="form" method="post" action="https://ingyzpbpnvnqlqkmxmqd.supabase.co/functions/v1/dirk-feishu-mcp/approve">
<input type="hidden" name="tx" id="tx">
<label for="code">Freigabecode</label>
<input type="password" name="code" id="code" maxlength="256" required autocomplete="off">
<button type="submit">Verbindung bestätigen</button>
</form>
</main>
<script>
(function(){
  const tx = new URLSearchParams(location.search).get('tx') || '';
  if(!/^[A-Za-z0-9_-]{43}$/.test(tx)){
    document.getElementById('info').textContent='Der Autorisierungslink ist ungültig oder abgelaufen. Bitte starte die Verbindung erneut in ChatGPT.';
    document.getElementById('form').classList.add('hidden');
  }else document.getElementById('tx').value=tx;
})();
</script>
</body>
</html>
